name: 'Docker Builder & Pusher'
description: 'Build and push Docker images to GitHub Container Registry with multi-platform support'
author: 'cfindlayisme'

inputs:
  github-token:
    description: 'GitHub token for container registry'
    required: true
  
  repository:
    description: 'GitHub repository (owner/name)'
    required: true
  
  ref:
    description: 'Git reference being built'
    required: true
  
  docker-platforms:
    description: 'Docker platforms to build for'
    required: false
    default: 'linux/amd64,linux/arm64'
  
  dockerfile-path:
    description: 'Path to Dockerfile'
    required: false
    default: './Dockerfile'
  
  docker-context:
    description: 'Docker build context'
    required: false
    default: '.'
  
  push-latest:
    description: 'Push :latest tag (only on main branch)'
    required: false
    default: 'true'
  
  additional-tags:
    description: 'Additional tags to push (comma-separated, e.g., "v1.0.0,stable")'
    required: false
    default: ''
  
  deploy-enabled:
    description: 'Enable Kubernetes deployment'
    required: false
    default: 'false'
  
  vault-addr:
    description: 'Vault server address (required if deploy-enabled is true)'
    required: false
    default: ''
  
  vault-role-id:
    description: 'Vault AppRole role ID (required if deploy-enabled is true)'
    required: false
    default: ''
  
  vault-secret-id:
    description: 'Vault AppRole secret ID (required if deploy-enabled is true)'
    required: false
    default: ''
  
  vault-kubeconfig-path:
    description: 'Vault path to kubeconfig secret'
    required: false
    default: 'kv/data/pipeline/k3s'
  
  staging-enabled:
    description: 'Enable staging deployment'
    required: false
    default: 'true'
  
  production-enabled:
    description: 'Enable production deployment'
    required: false
    default: 'true'
  
  staging-namespace:
    description: 'Kubernetes namespace for staging'
    required: false
    default: 'staging'
  
  production-namespace:
    description: 'Kubernetes namespace for production'
    required: false
    default: 'production'
  
  deployment-name:
    description: 'Kubernetes deployment name (required if deploy-enabled is true)'
    required: false
    default: ''

outputs:
  image-tags:
    description: 'Docker image tags that were built/pushed'
    value: ${{ steps.meta.outputs.tags }}
  
  deploy-result:
    description: 'Deployment result (only if deploy-enabled is true)'
    value: ${{ steps.deploy.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Login to GitHub Container Registry
      if: inputs.ref == 'refs/heads/main'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    
    - name: Prepare tags
      id: meta
      shell: bash
      run: |
        TAGS="ghcr.io/${{ inputs.repository }}:${GITHUB_SHA::7}"
        
        # Add latest tag if on main branch and enabled
        if [[ "${{ inputs.ref }}" == "refs/heads/main" && "${{ inputs.push-latest }}" == "true" ]]; then
          TAGS="$TAGS,ghcr.io/${{ inputs.repository }}:latest"
        fi
        
        # Add additional tags if provided
        if [[ -n "${{ inputs.additional-tags }}" ]]; then
          IFS=',' read -ra ADDITIONAL <<< "${{ inputs.additional-tags }}"
          for tag in "${ADDITIONAL[@]}"; do
            TAGS="$TAGS,ghcr.io/${{ inputs.repository }}:$tag"
          done
        fi
        
        echo "tags=$TAGS" >> $GITHUB_OUTPUT
        echo "Building tags: $TAGS"
    
    - name: Build Docker image (validation only)
      if: inputs.ref != 'refs/heads/main'
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.docker-context }}
        file: ${{ inputs.dockerfile-path }}
        platforms: ${{ inputs.docker-platforms }}
        push: false
        tags: ${{ steps.meta.outputs.tags }}
    
    - name: Build and push Docker image
      if: inputs.ref == 'refs/heads/main'
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.docker-context }}
        file: ${{ inputs.dockerfile-path }}
        platforms: ${{ inputs.docker-platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
    
    # Kubernetes Deployment (optional)
    - name: Retrieve kubeconfig from Vault
      id: import-secrets
      if: inputs.deploy-enabled == 'true'
      uses: hashicorp/vault-action@v4.0.0
      with:
        url: ${{ inputs.vault-addr }}
        method: approle
        roleId: ${{ inputs.vault-role-id }}
        secretId: ${{ inputs.vault-secret-id }}
        secrets: ${{ inputs.vault-kubeconfig-path }} kubeconfig
        exportEnv: true
    
    - name: Save kubeconfig to file
      if: inputs.deploy-enabled == 'true'
      run: |
        mkdir -p $HOME/.kube
        echo '${{ steps.import-secrets.outputs.kubeconfig }}' > $HOME/.kube/config
        echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
      shell: bash
    
    - name: Restart staging deployment
      id: deploy
      if: inputs.deploy-enabled == 'true' && inputs.staging-enabled == 'true'
      run: |
        kubectl -n ${{ inputs.staging-namespace }} rollout restart deployment ${{ inputs.deployment-name }}
      shell: bash
    
    - name: Restart production deployment
      if: inputs.deploy-enabled == 'true' && inputs.production-enabled == 'true' && inputs.ref == 'refs/heads/main'
      run: |
        kubectl -n ${{ inputs.production-namespace }} rollout restart deployment ${{ inputs.deployment-name }}
      shell: bash

branding:
  icon: 'package'
  color: 'blue'
